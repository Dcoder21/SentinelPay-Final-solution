services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelpay-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinelpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: sentinelpay-redis
    ports:
      - "6379:6379"

  payments-api:
    build: ./services/payments-api
    container_name: sentinelpay-payments
    ports:
      - "8001:8001"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8001"
      FLASK_DEBUG: "false"
      DATABASE_URL: postgresql://sentinel:sentinel123@postgres:5432/sentinelpay
      REDIS_URL: redis://redis:6379/0
      JWT_ISSUER: sentinelpay-payments-api
      JWT_ACTIVE_KID: dev-key-1
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key.pem
      JWT_PUBLIC_KEYS_PATH: /run/secrets/jwt_public_keys.json
      AWS_REGION: eu-west-2
      KYC_BUCKET: sentinelpay-kyc-documents
      WEBHOOK_TIMEOUT: "10"
      ENVIRONMENT: development
      INTERNAL_SIGNING_SECRET: sentinelpay-internal-signing-secret-dev
    volumes:
      - ./secrets/jwt_private_key_dev.pem:/run/secrets/jwt_private_key.pem:ro
      - ./secrets/jwt_public_keys.json:/run/secrets/jwt_public_keys.json:ro
    depends_on:
      - postgres
      - redis

  kyc-api:
    build: ./services/kyc-api
    container_name: sentinelpay-kyc
    ports:
      - "8002:8002"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8002"
      FLASK_DEBUG: "false"
      DATABASE_URL: postgresql://sentinel:sentinel123@postgres:5432/sentinelpay
      REDIS_URL: redis://redis:6379/1
      JWT_ISSUER: sentinelpay-payments-api
      JWT_PUBLIC_KEYS_PATH: /run/secrets/jwt_public_keys.json
      AWS_REGION: eu-west-2
      KYC_BUCKET: sentinelpay-kyc-documents
      BVN_LOOKUP_URL: https://api.mock-cbn.local/bvn
      ENVIRONMENT: development
      INTERNAL_SIGNING_SECRET: sentinelpay-internal-signing-secret-dev
    volumes:
      - ./secrets/jwt_public_keys.json:/run/secrets/jwt_public_keys.json:ro
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: